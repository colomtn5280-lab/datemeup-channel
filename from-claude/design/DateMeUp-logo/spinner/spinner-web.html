<!-- DateMeUp ticket spinner (web). Drop-in: copy the CSS once, use the markup anywhere. -->
<style>
.dmu-spinner{display:inline-flex;flex-direction:column;align-items:center;gap:10px}
.dmu-spinner svg{width:var(--dmu-size,64px);height:auto}
.dmu-spinner[hidden]{display:none}

.dmu-perf{stroke-dasharray:4 4;animation:dmu-perf .7s linear infinite}
.dmu-a{animation:dmu-bob 1.4s cubic-bezier(.45,0,.55,1) infinite;transform-box:fill-box;transform-origin:50% 100%}
.dmu-b{animation:dmu-bob 1.4s cubic-bezier(.45,0,.55,1) infinite .2s;transform-box:fill-box;transform-origin:50% 100%}
.dmu-bar1{animation:dmu-bar 1.4s steps(1,end) infinite}
.dmu-bar2{animation:dmu-bar 1.4s steps(1,end) infinite .35s}
@keyframes dmu-perf{to{stroke-dashoffset:-8}}
@keyframes dmu-bob{0%,60%,100%{transform:translateY(0)}25%{transform:translateY(-5px)}}
@keyframes dmu-bar{0%,49%{opacity:1}50%,100%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dmu-perf,.dmu-a,.dmu-b,.dmu-bar1,.dmu-bar2{animation:dmu-calm 2s ease-in-out infinite}
@keyframes dmu-calm{50%{opacity:.55}}}

</style>

<div class="dmu-spinner" role="status" aria-live="polite">
  <svg viewBox="5 15 90 70" aria-hidden="true"><path d="M14 22 H86 a5 5 0 0 1 5 5 V41 a8 8 0 0 0 0 16 V73 a5 5 0 0 1 -5 5 H14 a5 5 0 0 1 -5 -5 V57 a8 8 0 0 0 0 -16 V27 a5 5 0 0 1 5 -5 Z" fill="#FFFFFF" stroke="#1E1A38" stroke-width="4"/><path class="dmu-perf" d="M70 26 V74" stroke="#1E1A38" stroke-width="3"/><g class="dmu-a"><circle cx="31" cy="42" r="8" fill="#0E8A86"/><path d="M18 74 A13 13 0 0 1 44 74 Z" fill="#0E8A86"/></g><g class="dmu-b"><circle cx="48" cy="44" r="8" fill="#FF6B57"/><path d="M35 76 A13 13 0 0 1 61 76 Z" fill="#FF6B57"/></g><path class="dmu-bar1" d="M77 44 v12" stroke="#1E1A38" stroke-width="3.5" stroke-linecap="round"/><path class="dmu-bar2" d="M83 44 v12" stroke="#1E1A38" stroke-width="3.5" stroke-linecap="round"/></svg>
  <span class="dmu-visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading</span>
</div>
<!-- On dark (Night) surfaces: remove stroke/stroke-width from the first <path>. Size: style="--dmu-size:96px". -->
<!-- Show it only after 300 ms of loading, keep it ≥ 500 ms once visible (same rule as mobile). -->
